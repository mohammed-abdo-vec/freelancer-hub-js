<!doctype html>
<!--
  Source for docs/auth-flow.png. Edit the STEPS array below, then re-render:
  open this file in a browser and take a full-page screenshot (or use Playwright).
-->
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Auth flow diagram</title>
<style>
  body { margin: 0; background: #ffffff; font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; }
  svg text { font-family: inherit; }
  .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; }
</style>
</head>
<body>
<svg id="d" xmlns="http://www.w3.org/2000/svg" width="1800"></svg>
<script>
const W = 1800;
const LANES = {
  ui:     { x: 170,  title: 'UI / Components', sub: 'pages, route guards',        color: '#0f766e', bg: '#ccfbf1' },
  zs:     { x: 530,  title: 'Zustand',         sub: 'status · accessToken',       color: '#b45309', bg: '#fef3c7' },
  rq:     { x: 890,  title: 'React Query',     sub: 'useMe · useNotes · mutations', color: '#be185d', bg: '#fce7f3' },
  ax:     { x: 1250, title: 'axios  (http.js)', sub: 'interceptors',              color: '#4338ca', bg: '#e0e7ff' },
  srv:    { x: 1610, title: 'Express server',  sub: 'JWT · httpOnly cookie',      color: '#334155', bg: '#e2e8f0' },
};

const C = { call: '#334155', ret: '#64748b', err: '#dc2626', refresh: '#d97706', retry: '#7c3aed', ok: '#059669' };

// kind: call | ret | err | refresh | retry | ok      note: { at, text[], tone }
const PHASES = [
  { n: 1, title: 'Log in', desc: 'Server sends TWO tokens: one in the body, one in a cookie JS can never read', tint: '#f0fdfa', steps: [
    { from: 'ui', to: 'rq', label: 'useLogin().mutate({ email, password })' },
    { from: 'rq', to: 'ax', label: 'authApi.login()' },
    { from: 'ax', to: 'srv', label: 'POST /auth/login', mono: true },
    { note: { at: 'srv', text: ['bcrypt.compare(password)', 'sign access JWT (30s)', 'sign refresh JWT (7 days)'] } },
    { from: 'srv', to: 'ax', kind: 'ok', label: '200 { accessToken, user }', sub: '+ Set-Cookie: refresh_token  (httpOnly)', mono: true },
    { from: 'rq', to: 'zs', kind: 'ret', label: 'onSuccess → setSession(accessToken)', sub: 'status = "authenticated"' },
    { self: 'rq', label: "setQueryData(['auth','me'], user)", sub: 'no extra GET /me needed' },
    { from: 'rq', to: 'ui', kind: 'ret', label: 'navigate(from ?? "/dashboard")' },
  ]},
  { n: 2, title: 'Call a protected API', desc: 'Components never touch the token — the request interceptor adds it', tint: '#f8fafc', steps: [
    { from: 'ui', to: 'rq', label: 'useNotes()' },
    { from: 'rq', to: 'ax', label: "queryFn → http.get('/notes')", mono: true },
    { from: 'ax', to: 'zs', kind: 'ret', label: 'useAuthStore.getState().accessToken', sub: 'read outside React — no hook' },
    { from: 'ax', to: 'srv', label: 'GET /notes', sub: 'Authorization: Bearer eyJhbGci…', mono: true },
    { from: 'srv', to: 'ax', kind: 'ok', label: '200 [ …notes ]', mono: true },
    { from: 'rq', to: 'ui', kind: 'ret', label: 'data, isPending, isError → render' },
  ]},
  { n: 3, title: 'Access token expires  (after 30s)', desc: 'The 401 is caught, the token is refreshed and the request replayed — the user never notices', tint: '#fffbeb', steps: [
    { from: 'ax', to: 'srv', label: 'POST /notes', sub: 'Bearer <expired token>', mono: true },
    { from: 'srv', to: 'ax', kind: 'err', label: '401  "Access token expired"' },
    { from: 'ax', to: 'srv', kind: 'refresh', label: 'POST /auth/refresh', sub: '🍪 cookie attached automatically by the browser', mono: true },
    { note: { at: 'srv', text: ['ROTATION: old refresh id deleted,', 'new refresh token issued'], tone: 'warn' } },
    { from: 'srv', to: 'ax', kind: 'ok', label: '200 { accessToken }  + new cookie', mono: true },
    { from: 'ax', to: 'zs', kind: 'ret', label: 'setSession(newAccessToken)' },
    { from: 'ax', to: 'srv', kind: 'retry', label: 'retry POST /notes  (_retry = true)', sub: 'Bearer <new token>', mono: true },
    { from: 'srv', to: 'ax', kind: 'ok', label: '201 Created', mono: true },
    { note: { at: 'ax', text: ['5 requests get 401 at once?', '→ ONE shared refreshPromise', 'Refresh fails? → endSessionLocally()', '→ guards redirect to /login'], tone: 'info' } },
  ]},
  { n: 4, title: 'Page reload', desc: 'Memory is wiped, but the httpOnly cookie survives — AuthBootstrap uses it', tint: '#eef2ff', steps: [
    { note: { at: 'zs', text: ['accessToken = null', 'status = "checking"  → spinner'], tone: 'warn' } },
    { from: 'ui', to: 'ax', label: 'AuthBootstrap → refreshSession()' },
    { from: 'ax', to: 'srv', kind: 'refresh', label: 'POST /auth/refresh', sub: '🍪 cookie', mono: true },
    { from: 'srv', to: 'ax', kind: 'ok', label: '200 { accessToken }   or   401', mono: true },
    { from: 'ax', to: 'zs', kind: 'ret', label: 'setSession()  → "authenticated"', sub: 'or clearSession()  → "guest"' },
    { from: 'zs', to: 'ui', kind: 'ret', label: 'guards: render page  /  Navigate to /login' },
  ]},
  { n: 5, title: 'Log out', desc: 'Kill the session on the server AND wipe everything on the client', tint: '#fef2f2', steps: [
    { from: 'ui', to: 'rq', label: 'useLogout().mutate()' },
    { from: 'rq', to: 'ax', label: 'authApi.logout()' },
    { from: 'ax', to: 'srv', label: 'POST /auth/logout  🍪', mono: true },
    { note: { at: 'srv', text: ['delete refresh id', 'clear the cookie'] } },
    { from: 'srv', to: 'ax', kind: 'ok', label: '204 No Content', mono: true },
    { from: 'rq', to: 'zs', kind: 'ret', label: 'onSettled → clearSession()', sub: 'status = "guest"' },
    { self: 'rq', label: 'queryClient.clear()', sub: "next user can't see old user's data" },
    { from: 'zs', to: 'ui', kind: 'ret', label: 'RequireAuth → <Navigate to="/login" />' },
  ]},
];

// ---------------------------------------------------------------------------
const svg = document.getElementById('d');
const NS = 'http://www.w3.org/2000/svg';
const layers = { bands: g(), lines: g(), top: g() };
function g() { const el = document.createElementNS(NS, 'g'); svg.appendChild(el); return el; }
function el(parent, tag, attrs, text) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text != null) e.textContent = text;
  parent.appendChild(e);
  return e;
}

// arrowheads
const defs = el(svg, 'defs', {});
for (const [k, c] of Object.entries(C)) {
  const m = el(defs, 'marker', { id: 'a-' + k, viewBox: '0 0 10 10', refX: 9, refY: 5, markerWidth: 8, markerHeight: 8, orient: 'auto-start-reverse' });
  el(m, 'path', { d: 'M0,0 L10,5 L0,10 z', fill: c });
}

let y = 0;

// Title
el(layers.top, 'text', { x: 60, y: 70, 'font-size': 40, 'font-weight': 800, fill: '#0f172a' }, 'How the auth flow works');
el(layers.top, 'text', { x: 60, y: 108, 'font-size': 20, fill: '#64748b' }, 'React + Zustand + React Query + axios — access token in memory, refresh token in an httpOnly cookie');
y = 150;

// Lane headers
const HEAD_Y = y;
for (const lane of Object.values(LANES)) {
  el(layers.top, 'rect', { x: lane.x - 150, y: HEAD_Y, width: 300, height: 74, rx: 14, fill: lane.bg, stroke: lane.color, 'stroke-width': 2 });
  el(layers.top, 'text', { x: lane.x, y: HEAD_Y + 33, 'text-anchor': 'middle', 'font-size': 21, 'font-weight': 700, fill: lane.color }, lane.title);
  el(layers.top, 'text', { x: lane.x, y: HEAD_Y + 57, 'text-anchor': 'middle', 'font-size': 15, fill: '#475569' }, lane.sub);
}
y = HEAD_Y + 74 + 24;

for (const phase of PHASES) {
  const bandTop = y;
  y += 20;
  // phase title
  el(layers.top, 'circle', { cx: 52, cy: y + 14, r: 18, fill: '#0f172a' });
  el(layers.top, 'text', { x: 52, y: y + 21, 'text-anchor': 'middle', 'font-size': 19, 'font-weight': 800, fill: '#fff' }, phase.n);
  el(layers.top, 'text', { x: 82, y: y + 22, 'font-size': 24, 'font-weight': 800, fill: '#0f172a' }, phase.title);
  const t = el(layers.top, 'text', { x: 82, y: y + 48, 'font-size': 16, fill: '#475569' }, phase.desc);
  y += 80;

  for (const s of phase.steps) {
    if (s.note) { y = drawNote(s.note, y); continue; }
    if (s.self) { y = drawSelf(s, y); continue; }
    y = drawArrow(s, y);
  }
  y += 10;
  el(layers.bands, 'rect', { x: 20, y: bandTop, width: W - 40, height: y - bandTop, rx: 18, fill: phase.tint, stroke: '#e2e8f0' });
  y += 18;
}

// lifelines behind everything
for (const lane of Object.values(LANES)) {
  el(layers.lines, 'line', { x1: lane.x, y1: HEAD_Y + 74, x2: lane.x, y2: y, stroke: lane.color, 'stroke-width': 2, 'stroke-dasharray': '4 6', opacity: 0.45 });
}
svg.insertBefore(layers.lines, layers.top);

// Legend: where does everything live?
y = drawLegend(y + 10);
svg.setAttribute('height', y + 40);
svg.setAttribute('viewBox', `0 0 ${W} ${y + 40}`);

// ---------------------------------------------------------------------------
function drawArrow(s, y) {
  const kind = s.kind ?? 'call';
  const color = C[kind];
  const x1 = LANES[s.from].x, x2 = LANES[s.to].x;
  const dir = Math.sign(x2 - x1);
  const ly = y + 26;
  el(layers.top, 'line', {
    x1: x1 + dir * 6, y1: ly, x2: x2 - dir * 6, y2: ly, stroke: color, 'stroke-width': kind === 'call' ? 2.5 : 2.5,
    'stroke-dasharray': kind === 'ret' ? '8 6' : '', 'marker-end': `url(#a-${kind})`,
  });
  const mid = (x1 + x2) / 2;
  const label = el(layers.top, 'text', { x: mid, y: ly - 10, 'text-anchor': 'middle', 'font-size': 17, 'font-weight': 600, fill: kind === 'call' || kind === 'ret' ? '#0f172a' : color, class: s.mono ? 'mono' : '' }, s.label);
  if (s.mono) label.setAttribute('font-size', 16);
  if (s.sub) el(layers.top, 'text', { x: mid, y: ly + 24, 'text-anchor': 'middle', 'font-size': 14.5, fill: '#64748b', class: s.mono && s.sub.startsWith('Bearer') || s.sub?.startsWith('Authorization') ? 'mono' : '' }, s.sub);
  if (kind === 'err' || kind === 'refresh' || kind === 'retry') {
    const tag = { err: '✕', refresh: '↻', retry: '⟲' }[kind];
    el(layers.top, 'circle', { cx: x1 + dir * -0 + (dir > 0 ? -22 : 22), cy: ly, r: 13, fill: color });
    el(layers.top, 'text', { x: x1 + (dir > 0 ? -22 : 22), y: ly + 5, 'text-anchor': 'middle', 'font-size': 15, 'font-weight': 800, fill: '#fff' }, tag);
  }
  return y + (s.sub ? 72 : 52);
}

function drawSelf(s, y) {
  const x = LANES[s.self].x;
  const color = C.call;
  const top = y + 10, h = 34;
  el(layers.top, 'path', { d: `M${x + 6},${top} h46 v${h} h-40`, fill: 'none', stroke: color, 'stroke-width': 2.5, 'marker-end': 'url(#a-call)' });
  el(layers.top, 'text', { x: x + 64, y: top + 14, 'font-size': 16, 'font-weight': 600, fill: '#0f172a', class: 'mono' }, s.label);
  if (s.sub) el(layers.top, 'text', { x: x + 64, y: top + 36, 'font-size': 14.5, fill: '#64748b' }, s.sub);
  return y + 66;
}

function drawNote(note, y) {
  const tones = {
    default: { fill: '#ffffff', stroke: '#94a3b8', text: '#334155' },
    warn: { fill: '#fff7ed', stroke: '#fb923c', text: '#9a3412' },
    info: { fill: '#f5f3ff', stroke: '#a78bfa', text: '#5b21b6' },
  };
  const tone = tones[note.tone ?? 'default'];
  const width = Math.max(...note.text.map((l) => l.length)) * 9.2 + 36;
  const h = note.text.length * 24 + 20;
  let x = LANES[note.at].x - width / 2;
  x = Math.min(x, W - 30 - width);
  el(layers.top, 'rect', { x, y: y + 6, width, height: h, rx: 10, fill: tone.fill, stroke: tone.stroke, 'stroke-width': 1.5 });
  note.text.forEach((line, i) => {
    el(layers.top, 'text', { x: x + 18, y: y + 6 + 30 + i * 24, 'font-size': 15.5, fill: tone.text, 'font-weight': i === 0 ? 600 : 400 }, line);
  });
  return y + h + 22;
}

function drawLegend(y) {
  el(layers.top, 'text', { x: 60, y: y + 30, 'font-size': 24, 'font-weight': 800, fill: '#0f172a' }, 'Where does everything live?');
  const rows = [
    ['Access token', 'Zustand — memory only', 'short-lived (30s), sent as "Authorization: Bearer"', LANES.zs],
    ['Refresh token', 'httpOnly cookie', 'JavaScript can NOT read it → safe from XSS. Rotated on every refresh', LANES.srv],
    ['User, notes, stats', 'React Query cache', 'server state: fetched, cached, invalidated, cleared on logout', LANES.rq],
    ['lastEmail', 'localStorage (persist)', 'harmless preference — partialize keeps the token OUT of storage', LANES.ui],
  ];
  y += 56;
  rows.forEach(([what, where, why, lane], i) => {
    const ry = y + i * 54;
    el(layers.top, 'rect', { x: 40, y: ry, width: W - 80, height: 46, rx: 10, fill: i % 2 ? '#ffffff' : '#f8fafc', stroke: '#e2e8f0' });
    el(layers.top, 'text', { x: 64, y: ry + 30, 'font-size': 18, 'font-weight': 700, fill: '#0f172a' }, what);
    el(layers.top, 'rect', { x: 300, y: ry + 9, width: 280, height: 28, rx: 14, fill: lane.bg, stroke: lane.color });
    el(layers.top, 'text', { x: 440, y: ry + 29, 'text-anchor': 'middle', 'font-size': 16, 'font-weight': 700, fill: lane.color }, where);
    el(layers.top, 'text', { x: 610, y: ry + 30, 'font-size': 16.5, fill: '#475569' }, why);
  });
  y += rows.length * 54 + 20;

  // arrow key
  const keys = [['call', 'request / call'], ['ret', 'response / update'], ['ok', 'success'], ['err', '401 error'], ['refresh', 'refresh'], ['retry', 'retry']];
  let kx = 64;
  keys.forEach(([k, label]) => {
    el(layers.top, 'line', { x1: kx, y1: y + 12, x2: kx + 50, y2: y + 12, stroke: C[k], 'stroke-width': 2.5, 'stroke-dasharray': k === 'ret' ? '8 6' : '', 'marker-end': `url(#a-${k})` });
    el(layers.top, 'text', { x: kx + 62, y: y + 18, 'font-size': 16, fill: '#475569' }, label);
    kx += 62 + label.length * 9 + 50;
  });
  return y + 30;
}
</script>
</body>
</html>
